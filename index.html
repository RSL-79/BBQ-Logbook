<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#222'><title>BBQ Logbook</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#f5f5f5;color:#222}header{background:#222;color:white;padding:20px;position:sticky;top:0}main{max-width:680px;margin:auto;padding:16px 16px 80px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px #0001}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:13px}.big{width:100%;background:#333;color:#fff;font-weight:700;font-size:18px;padding:18px}label{display:block;font-weight:700;font-size:13px;color:#555;margin:13px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}textarea{min-height:90px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}.muted{color:#666;font-size:14px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex}nav button{flex:1;background:#fff}.hidden{display:none}</style></head><body><header><h1>🔥 BBQ Logbook</h1><div id='sub'>Your personal BBQ history</div></header><main id='app'></main><nav><button onclick="home()">🏠<br>Home</button><button onclick="cooks()">📋<br>Cooks</button><button onclick="recipes()">📖<br>Recipes</button></nav><script>
const P=['Beef Tri-Tip','Beef Brisket','Beef Ribs','Pork Shoulder / Pulled Pork','Pork Ribs','Turkey','Chicken','Other'];let db=JSON.parse(localStorage.getItem('bbqLogbook')||'null')||{cooks:[],recipes:[]};const save=()=>localStorage.setItem('bbqLogbook',JSON.stringify(db));const app=document.getElementById('app');
function home(){app.innerHTML=`<div class='card'><button class='big' onclick='plan()'>🔥 PLAN A COOK</button></div><div class='card'><h2>Recent Cooks</h2>${db.cooks.slice(-3).reverse().map(c=>card(c)).join('')||'<p class="muted">No cooks recorded yet.</p>'}<button onclick='cooks()'>View All Cooks</button></div><div class='card'><h2>Recipes</h2><p class='muted'>${db.recipes.length} saved recipe${db.recipes.length==1?'':'s'}.</p><button onclick='recipes()'>Open My Recipes</button></div>`}
function card(c){let y=c.raw&&c.cooked?(c.cooked/c.raw*100).toFixed(0):'—';return `<div class='card'><b>#${c.num} — ${c.protein}</b><div class='muted'>${c.raw||'—'} lb raw → ${c.cooked||'—'} lb cooked · ${c.people} people · ${'⭐'.repeat(c.rating||0)}</div><div>Yield: ${y}% · Leftovers: ${c.leftover||0} lb</div></div>`}
function plan(){app.innerHTML=`<div class='card'><h2>🔥 Plan a Cook</h2><label>Protein</label><select id='p'>${P.map(x=>`<option>${x}</option>`).join('')}</select><label>How many people?</label><input id='people' type='number' value='5' min='1'><label>Leftovers</label><select id='left'><option>None</option><option selected>Some</option><option>Lots</option></select><label>When are you eating?</label><input id='date' type='date'><label>Dinner time</label><input id='time' type='time' value='18:00'><label>Planned raw weight (optional)</label><input id='raw' type='number' step='.1' placeholder='e.g. 3.0'><div id='estimate' class='card'>Planning estimate will appear here.</div></div><button class='big' onclick='startCook()'>🔥 START THIS COOK</button>`;document.getElementById('p').onchange=estimate;document.getElementById('people').oninput=estimate;document.getElementById('left').onchange=estimate;estimate()}
function estimate(){let p=document.getElementById('p').value,n=+document.getElementById('people').value||1,cs=db.cooks.filter(c=>c.protein==p&&c.raw&&c.cooked),yp=cs.length?cs.reduce((a,c)=>a+c.cooked/c.raw,0)/cs.length:.67,oz=cs.length?cs.reduce((a,c)=>a+((c.cooked-c.leftover)*16/c.people),0)/cs.length:5,extra=document.getElementById('left').value=='Lots'?1:document.getElementById('left').value=='Some'?.5:0,cooked=n*oz/16+extra,raw=cooked/yp;document.getElementById('estimate').innerHTML=`<b>Planning estimate</b><br>Recommended raw amount: <strong>${raw.toFixed(1)} lb</strong><br>Expected cooked amount: <strong>${cooked.toFixed(1)} lb</strong><br>Based on ${cs.length?'your '+cs.length+' matching cook'+(cs.length==1?'':'s'):'starting assumptions'}.`}
function startCook(){db.active={num:(db.cooks.length?Math.max(...db.cooks.map(c=>c.num)):0)+1,protein:document.getElementById('p').value,people:+document.getElementById('people').value||1,raw:+document.getElementById('raw').value||0,start:new Date().toISOString()};save();finish()}
function finish(){let c=db.active;app.innerHTML=`<div class='card'><h2>🔥 Finish Cook — #${c.num}</h2><label>Pull time</label><input id='pull' type='time'><label>Final cooked weight</label><input id='cooked' type='number' step='.1' placeholder='e.g. 2.0'><label>Rest time</label><input id='rest' placeholder='e.g. 45 min'><label>People fed</label><input id='fed' type='number' value='${c.people}' min='1'><label>Leftover weight</label><input id='leftover' type='number' step='.1' placeholder='e.g. 0.5'><div id='result' class='card'>Enter cooked weight and leftovers for results.</div></div><div class='card'><label>Rating</label><select id='rating'><option value='5'>⭐⭐⭐⭐⭐</option><option value='4'>⭐⭐⭐⭐</option><option value='3'>⭐⭐⭐</option><option value='2'>⭐⭐</option><option value='1'>⭐</option></select><label>Pellets</label><input id='pellets'><label>Rub / seasoning</label><input id='rub'><label>Notes</label><textarea id='notes'></textarea></div><button class='big' onclick='saveCook()'>SAVE COOK</button>`;['cooked','leftover','fed'].forEach(id=>document.getElementById(id).oninput=calc)}
function calc(){let c=+document.getElementById('cooked').value||0,l=+document.getElementById('leftover').value||0,f=+document.getElementById('fed').value||0,r=db.active.raw,e=Math.max(0,c-l);document.getElementById('result').innerHTML=`<b>Your results</b><br>Cooked yield: <strong>${r?(c/r*100).toFixed(0):'—'}%</strong><br>Amount eaten: <strong>${e.toFixed(2)} lb</strong><br>Average consumed: <strong>${f?((e*16)/f).toFixed(1):'—'} oz/person</strong>`}
function saveCook(){let c=db.active;c.pull=document.getElementById('pull').value;c.cooked=+document.getElementById('cooked').value||0;c.rest=document.getElementById('rest').value;c.people=+document.getElementById('fed').value||c.people;c.leftover=+document.getElementById('leftover').value||0;c.rating=+document.getElementById('rating').value;c.pellets=document.getElementById('pellets').value;c.rub=document.getElementById('rub').value;c.notes=document.getElementById('notes').value;db.cooks.push(c);delete db.active;save();cooks()}
function cooks(){app.innerHTML=`<h2>📋 Cook History</h2>${db.cooks.slice().reverse().map(card).join('')||'<div class="card muted">No cooks recorded yet.</div>'}`}
function recipes(){app.innerHTML=`<div class='card'><h2>📖 My Recipes</h2><p class='muted'>Recipes will be able to come from uploaded PDFs in the next build.</p><button class='big' onclick='addRecipe()'>＋ ADD RECIPE</button></div>${db.recipes.map((r,i)=>`<div class='card'><b>${r.name}</b><p class='muted'>${r.method||''}</p></div>`).join('')}`}
function addRecipe(){let n=prompt('Recipe name:');if(!n)return;let m=prompt('Recipe instructions:')||'';db.recipes.push({name:n,method:m});save();recipes()}
home();</script></body></html>
