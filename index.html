function moveRow(btn,dir){let row=btn.closest('[data-ing-row]'),p=row.parentElement;if(dir<0&&row.previousElementSibling&&!row.previousElementSibling.matches('[data-section-row]'))p.insertBefore(row,row.previousElementSibling);else if(dir>0&&row.nextElementSibling&&!row.nextElementSibling.matches('[data-section-row]'))p.insertBefore(row.nextElementSibling,row)}
function sectionChunk(row){let a=[row],n=row.nextElementSibling;while(n&&!n.matches('[data-section-row]')){a.push(n);n=n.nextElementSibling}return a}
function moveSection(btn,dir){let row=btn.closest('[data-section-row]'),p=row.parentElement,chunk=sectionChunk(row);if(dir<0){let prev=row.previousElementSibling;while(prev&&!prev.matches('[data-section-row]'))prev=prev.previousElementSibling;if(prev)chunk.forEach(x=>p.insertBefore(x,prev))}else{let after=chunk[chunk.length-1].nextElementSibling;if(after){let target=sectionChunk(after),ref=target[target.length-1].nextElementSibling;chunk.forEach(x=>p.insertBefore(x,ref))}}}

function moveUnit(btn,dir){let row=btn.closest('[data-unit-row]'),parent=row.parentElement;if(dir<0&&row.previousElementSibling)parent.insertBefore(row,row.previousElementSibling);else if(dir>0&&row.nextElementSibling)parent.insertBefore(row.nextElementSibling,row)}
function restoreUnitDefaults(){if(!confirm('Restore the default ingredient units and order?'))return;let units=['each','lb','oz','cup','tbsp','tsp','fl oz','mL','L','g','kg','package','can','bottle','pinch','dash'];document.getElementById('unitList').innerHTML=units.map((x,i)=>unitEditorRow(x,i)).join('')}
function showSettingsPage(){nav('Home');app.innerHTML=`<button class="back" onclick="home()">← Home</button><div class="card"><h2>⚙️ Settings</h2><label>Default planned rest time (minutes)</label><input id="setRest" type="number" inputmode="numeric" min="0" value="${db.settings.defaultRest}"><p class="hint">Used when planning a cook manually. Recipes use their own planned rest time; a recipe with no rest uses 0 minutes.</p></div><div class="card"><h3>Pellets</h3><label>Default pellets</label><select id="setDefaultPellet">${db.settings.pellets.map(x=>`<option ${x===db.settings.defaultPellet?'selected':''}>${esc(x)}</option>`).join('')}</select>${listEditor('pellets',db.settings.pellets)}</div><div class="card"><h3>Rubs / Seasonings</h3>${listEditor('rubs',db.settings.rubs)}</div><div class="card"><h3>Proteins</h3><p class="hint">Broad protein groups used for recipe browsing. Recipes can use more than one.</p>${listEditor('proteins',db.settings.proteins)}</div><div class="card"><h3>Cuts / Items</h3><p class="hint">Specific cuts/items used for cook history, time estimates and planning.</p>${listEditor('cuts',db.settings.cuts)}</div><div class="card"><h3>Recipe Categories</h3>${listEditor('recipeCategories',db.settings.recipeCategories)}</div><div class="card"><h3>Ingredient Units</h3><p class="hint">The order here is the order shown in recipe ingredient dropdowns. No Unit is always available.</p><div id="unitList">${db.settings.ingredientUnits.map((x,i)=>unitEditorRow(x,i)).join('')}</div><button class="smallbtn" style="width:100%;margin-top:8px" onclick="addUnit()">＋ Add Unit</button><button class="smallbtn" style="width:100%;margin-top:8px" onclick="restoreUnitDefaults()">Restore Defaults</button></div><button class="big" onclick="saveSettings()">SAVE SETTINGS</button><div class="card" style="margin-top:14px"><h3>Data Backup</h3><p class="muted">Export a backup before updates or anytime you want an extra copy.</p><div class="toolbar"><button class="smallbtn" onclick="exportBackup()">Export Backup</button><button class="smallbtn" onclick="document.getElementById('restoreFile').click()">Restore Backup</button></div><input id="restoreFile" type="file" accept="application/json" style="display:none" onchange="restoreBackup(event)"></div>`;wireKeyboard()}
function listEditor(type,items){return `<div id="list-${type}">${items.map((x,i)=>`<div class="two" style="margin:7px 0"><input data-list="${type}" value="${esc(x)}"><button class="smallbtn danger" onclick="this.parentElement.remove()">Remove</button></div>`).join('')}</div><button class="smallbtn" style="width:100%;margin-top:8px" onclick="addListItem('${type}')">＋ Add</button>`}function addListItem(type){document.getElementById('list-'+type).insertAdjacentHTML('beforeend',`<div class="two" style="margin:7px 0"><input data-list="${type}" placeholder="New ${type.slice(0,-1)}"><button class="smallbtn danger" onclick="this.parentElement.remove()">Remove</button></div>`)}function saveSettings(){db.settings.defaultRest=Math.max(0,+document.getElementById('setRest').value||0);db.settings.ingredientUnits=[...document.querySelectorAll('[data-unit]')].map(x=>x.value.trim()).filter((x,i,a)=>x&&a.indexOf(x)===i);['pellets','rubs','proteins','cuts','recipeCategories'].forEach(type=>{db.settings[type]=[...document.querySelectorAll(`[data-list="${type}"]`)].map(x=>x.value.trim()).filter(Boolean)});let d=document.getElementById('setDefaultPellet').value;db.settings.defaultPellet=db.settings.pellets.includes(d)?d:(db.settings.pellets[0]||'');save();home()}
function normalizeImportedRecipe(x){let src=x.recipe||x;if(!src||!src.name)throw Error('Recipe name is missing');let r=blankRecipe();r.id=rid();r.name=String(src.name);r.type=['bbq-log','bbq-recipe','kitchen'].includes(src.type)?src.type:'kitchen';r.category=src.category||'Main Dish';r.favorite=!!src.favorite;r.servings=src.servings||null;r.prepMinutes=src.prepMinutes||null;r.cookMinutes=src.cookMinutes||null;r.ingredients=(src.ingredients||[]).map(v=>typeof v==='string'?{quantity:'',unit:'',item:v,group:''}:{quantity:String(v.quantity||''),unit:String(v.unit||''),item:String(v.item||v.text||''),group:String(v.group||v.section||'')}).filter(v=>v.quantity||v.unit||v.item);r.steps=(src.steps||src.directions||[]).map(v=>typeof v==='string'?v:(v.text||v.instruction||'')).filter(Boolean);r.notes=src.notes||'';if(src.recommendedCombination)r.notes+=(r.notes?'\n\n':'')+'RECOMMENDED COMBINATION\n'+src.recommendedCombination;if(src.kidFriendly)r.notes+=(r.notes?'\n\n':'')+'KID-FRIENDLY\n'+src.kidFriendly;if(src.leftoverTip)r.notes+=(r.notes?'\n\n':'')+'LEFTOVER TIP\n'+src.leftoverTip;if(Array.isArray(src.proteins))r.proteins=src.proteins.map(String);else if(src.protein){let m=legacyProteinCut(src.protein);r.proteins=[m[0]]}r.recipeRating=+src.recipeRating||0;if(r.type!=='kitchen'){if(!r.proteins.length&&src.protein){let m=legacyProteinCut(src.protein);r.proteins=[m[0]]}r.cut=src.cut||src.item||(src.protein?legacyProteinCut(src.protein)[1]:'');r.protein=r.cut;r.pellets=src.pellets||'';r.rubs=Array.isArray(src.rubs)?src.rubs:[];r.startTemp=src.startTemp||null;r.wrapTarget=src.wrapTarget||null;r.afterWrapTemp=src.afterWrapTemp||null;r.pullTarget=src.pullTarget||null;r.restMinutes=src.restMinutes??null;if(r.cut&&!db.settings.cuts.includes(r.cut))db.settings.cuts.push(r.cut)}return r}
function importRecipeFile(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result),r=normalizeImportedRecipe(x);db.recipes.push(r);save();alert('Recipe imported. Review it, then use Edit if you want to make changes.');openRecipe(r.id)}catch(err){alert('That file is not a valid BBQ Logbook recipe import file. '+(err.message||''))}e.target.value=''};rd.readAsText(f)}
function exportBackup(){let blob=new Blob([JSON.stringify({version:'3.2.3',exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BBQ_Logbook_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!d.cooks||!Array.isArray(d.cooks))throw Error();if(confirm('Restore this backup? It will replace the logbook data currently on this device.')){db=d;db.plans=db.plans||[];db.recipes=db.recipes||[];db.settings=db.settings||{};db.settings.proteins=db.settings.proteins||DEFAULT_PROTEINS.slice();db.settings.cuts=db.settings.cuts||DEFAULT_CUTS.slice();db.settings.recipeCategories=db.settings.recipeCategories||['Main Dish','Appetizer','Side','Dessert','Sauce','Vegetable','Sandwich','Baked Goods','Other'];db.settings.ingredientUnits=db.settings.ingredientUnits||['each','lb','oz','cup','tbsp','tsp','fl oz','mL','L','g','kg','package','can','bottle','pinch','dash'];save();home()}}catch(_){alert('That file is not a valid BBQ Logbook backup.')}};r.readAsText(f)}
function wireKeyboard(){document.querySelectorAll('input[type=number]').forEach(x=>{x.addEventListener('focus',()=>document.getElementById('donebar').style.display='block');x.addEventListener('blur',()=>setTimeout(()=>{if(!document.activeElement||document.activeElement.type!=='number')document.getElementById('donebar').style.display='none'},100))})}function dismissKeyboard(){document.activeElement?.blur();document.getElementById('donebar').style.display='none'}app.addEventListener('click',e=>{if(document.activeElement?.type==='number'&&!e.target.closest('input'))dismissKeyboard()});
home();
</script></body></html>
