<style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f4f4;color:#222}header{background:#222;color:#fff;padding:18px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:24px}header div{margin-top:3px;color:#ccc;font-size:13px}main{max-width:680px;margin:auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom))}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px #0001}.big{width:100%;background:#333;color:#fff;font-weight:750;font-size:18px;padding:18px;border:0;border-radius:13px}.secondary{background:#555}.section-title{margin:6px 2px 10px;font-size:17px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border-radius:14px;padding:15px;text-align:center;box-shadow:0 1px 4px #0001}.stat .num{font-size:25px;font-weight:800}.stat .lbl{font-size:12px;color:#666;margin-top:3px}.muted{color:#666;font-size:14px}label{display:block;font-weight:700;font-size:13px;color:#555;margin:13px 0 6px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;background:#fff}textarea{min-height:100px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.duration{font-weight:750}.estimate{background:#f7f7f7;border-radius:12px;padding:12px;margin-top:14px}.save{margin-top:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;background:#fff;border:0;padding:10px 4px 9px;font-size:12px;color:#333}.nav .active{font-weight:800}.empty{padding:20px;text-align:center}.cook-wrap{position:relative;overflow:hidden;border-radius:15px;margin-bottom:10px}.cook-row{background:#fff;padding:15px;position:relative;z-index:2;transition:transform .2s ease;touch-action:pan-y}.delete-bg{position:absolute;inset:0;background:#d33;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;color:#fff;font-weight:800}.delete-btn{position:absolute;right:0;top:0;height:100%;width:85px;background:#d33;color:#fff;border:0;font-weight:800;z-index:1}.plan-card{background:#fff;border-radius:15px;padding:15px;margin-bottom:10px;box-shadow:0 1px 4px #0001}.plan-date{font-size:13px;color:#666;font-weight:700}.plan-title{font-size:17px;font-weight:800;margin:4px 0 8px}.plan-meta{font-size:13px;color:#555;line-height:1.55}.plan-actions{display:flex;gap:8px;margin-top:10px}.plan-actions button{flex:1}.detail{margin-top:8px}.pill{display:inline-block;background:#eee;border-radius:20px;padding:4px 8px;font-size:12px;margin:2px}.smallbtn{padding:9px 12px;border-radius:10px;background:#eee;border:0}.danger{background:#d33!important;color:#fff}.back{background:none;border:0;padding:0 0 10px;font-weight:700}.hint{font-size:12px;color:#777;margin-top:6px}.temp-change{border-top:1px solid #eee;margin-top:10px;padding-top:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1;min-width:130px}.donebar{position:fixed;left:0;right:0;bottom:0;background:#eee;border-top:1px solid #ccc;padding:8px 16px calc(8px + env(safe-area-inset-bottom));z-index:30;text-align:right;display:none}.donebar button{border:0;background:#333;color:white;border-radius:9px;padding:8px 18px;font-weight:700}.recipe-card{position:relative}.heart{position:absolute;right:14px;top:12px;border:0;background:none;font-size:25px;padding:4px}.recipe-meta{font-size:13px;color:#666;line-height:1.5;padding-right:38px}.searchrow{display:grid;grid-template-columns:1fr auto;gap:8px}.chipbar{display:flex;gap:7px;overflow:auto;padding:3px 0 10px}.chip{white-space:nowrap;border:0;border-radius:18px;padding:8px 11px;background:#e9e9e9}.chip.on{background:#333;color:#fff}.listline{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0;align-items:start}.listline button{min-width:72px}.ingredient-grid{display:grid;grid-template-columns:70px 78px 1fr auto;gap:7px;margin:8px 0;align-items:center}.ingredient-grid button{min-width:72px}@media(max-width:520px){.ingredient-grid{grid-template-columns:68px 72px 1fr}.ingredient-grid button{grid-column:1/-1;width:100%}}.stepnum{font-weight:800;padding-top:11px}.stepgrid{display:grid;grid-template-columns:28px 1fr auto;gap:7px;margin:8px 0}.subhead{font-weight:800;margin:18px 0 6px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:110px}.tag{display:inline-block;background:#eee;border-radius:14px;padding:4px 8px;margin:2px;font-size:12px}</style></head><body>
<header><h1>🔥 BBQ Logbook</h1><div>V3.1 · Your personal BBQ history & recipes</div></header><main id="app"></main><nav class="nav"><button id="nHome" onclick="home()">🏠<br>Home</button><button id="nCooks" onclick="cooks()">📋<br>Cooks</button><button id="nRecipes" onclick="recipes()">📖<br>Recipes</button></nav><div class="donebar" id="donebar"><button onclick="dismissKeyboard()">Done</button></div>
<script>
const DEFAULT_P=['Beef Tri-Tip','Beef Brisket','Beef Ribs','Pork Shoulder / Pulled Pork','Pork Ribs','Turkey','Chicken','Other'];
const seedCooks=[{num:1,protein:'Pork Shoulder / Pulled Pork',people:null,raw:9.6,cooked:null,leftover:null,start:null,pull:null,rating:4,pellets:'Recteq Ultimate Blend',rub:'',notes:'Turned out good, not great; bark could have been better.'},{num:2,protein:'Beef Tri-Tip',people:null,raw:2.8,cooked:null,leftover:null,start:'2026-08-16T10:08',pull:'2026-08-16T17:01',rating:5,pellets:'Recteq Ultimate Blend',rub:'Four Letter Rub + Ben’s Heffer Dust',notes:'Cooked like brisket. Turned out great.'},{num:3,protein:'Beef Tri-Tip',people:null,raw:2.8,cooked:null,leftover:null,start:'2026-08-21T10:08',pull:'2026-08-21T17:01',rating:5,pellets:'Recteq Ultimate Blend',rub:'Four Letter Rub + Ben’s Heffer Dust',notes:'Cooked like brisket. Turned out great.'}];
let db;try{db=JSON.parse(localStorage.getItem('bbqLogbookV2')||'null')}catch(e){}if(!db)db={cooks:seedCooks,recipes:[],active:null,plans:[]};db.cooks=db.cooks||[];db.recipes=db.recipes||[];db.plans=db.plans||[];db.settings=db.settings||{};db.settings.proteins=db.settings.proteins||DEFAULT_P.slice();db.settings.pellets=db.settings.pellets||['Recteq Ultimate Blend'];db.settings.rubs=db.settings.rubs||['Four Letter Rub','Ben’s Heffer Dust','Rossarooski’s Honey Rib Rub'];db.settings.defaultPellet=db.settings.defaultPellet||db.settings.pellets[0]||'';db.settings.defaultRest=Number.isFinite(+db.settings.defaultRest)?+db.settings.defaultRest:30;db.settings.recipeCategories=db.settings.recipeCategories||['Main Dish','Appetizer','Side','Dessert','Sauce','Other'];const P=db.settings.proteins;db.recipes.forEach((r,i)=>{if(!r.id)r.id='legacy'+i+'_'+Date.now().toString(36);if(!r.type)r.type=r.protein?'bbq-log':'kitchen';if(!r.category)r.category='Main Dish';if(r.favorite==null)r.favorite=false;if(!r.ingredients)r.ingredients=[];r.ingredients=r.ingredients.map(x=>typeof x==='string'?{quantity:'',unit:'',item:x}:{quantity:x.quantity||'',unit:x.unit||'',item:x.item||x.text||''});if(!r.steps)r.steps=r.method?[r.method]:[]});const app=document.getElementById('app');
function save(){localStorage.setItem('bbqLogbookV2',JSON.stringify(db));localStorage.setItem('bbqLogbookV2_backup',JSON.stringify({savedAt:new Date().toISOString(),data:db}))}save();
function has(v){return v!==undefined&&v!==null&&v!==''&&Number.isFinite(Number(v))}function nav(a){['Home','Cooks','Recipes'].forEach(x=>document.getElementById('n'+x).classList.toggle('active',x===a))}function hours(c){if(!c.start||!c.pull)return 0;let h=(new Date(c.pull)-new Date(c.start))/36e5;return h>0?h:0}function fmtDur(h){if(!h)return '—';let m=Math.round(h*60);return Math.floor(m/60)+' hr '+(m%60)+' min'}function stars(n){return '⭐'.repeat(n||0)}function lbOz(v){if(!has(v))return 'Not recorded';let total=Math.round(Number(v)*160)/10,lb=Math.floor(total/16),oz=Math.round((total-lb*16)*10)/10;return `${lb} lb ${oz} oz`}function fromLbOz(l,o){return (+l||0)+(+o||0)/16}function splitWeight(v){if(!has(v))return [0,''];let lb=Math.floor(+v),oz=Math.round((+v-lb)*160)/10;return [lb,oz||'']}function weightFields(prefix,label,v){let [l,o]=splitWeight(v);return `<label>${label}</label><div class="two"><div><input id="${prefix}Lb" type="number" inputmode="decimal" min="0" step="1" value="${l||''}" placeholder="lb"><div class="hint">lb</div></div><div><input id="${prefix}Oz" type="number" inputmode="decimal" min="0" max="15.9" step=".1" value="${o}" placeholder="oz"><div class="hint">oz</div></div></div>`}function localInput(iso){if(!iso)return '';let d=new Date(iso);if(isNaN(d))return '';let p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}function iso(v){return v?new Date(v).toISOString():null}function restHours(c){if(!c.pull||!c.served)return 0;let h=(new Date(c.served)-new Date(c.pull))/36e5;return h>0?h:0}
function home(){nav('Home');let total=db.cooks.reduce((a,c)=>a+hours(c),0),rated=db.cooks.filter(c=>has(c.rating)),avg=rated.length?rated.reduce((a,c)=>a+Number(c.rating),0)/rated.length:0,counts={};db.cooks.forEach(c=>counts[c.protein]=(counts[c.protein]||0)+1);let top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0],plans=db.plans.slice().sort((a,b)=>new Date(a.dinner)-new Date(b.dinner));app.innerHTML=`<div style="text-align:right;margin-bottom:10px"><button class="smallbtn" onclick="settings()">⚙️ Settings</button></div><div class="card"><button class="big" onclick="startCookForm()">🔥 START A COOK</button><button class="big secondary" style="margin-top:10px" onclick="plan()">📅 PLAN A COOK</button></div><div class="section-title">YOUR BBQ INFO</div><div class="stats"><div class="stat"><div class="num">${db.cooks.length}</div><div class="lbl">TOTAL COOKS</div></div><div class="stat"><div class="num">${fmtDur(total)}</div><div class="lbl">TOTAL COOK TIME</div></div><div class="stat"><div class="num">${top?top[1]+'×':'—'}</div><div class="lbl">MOST COOKED</div><div class="muted">${top?top[0]:'—'}</div></div><div class="stat"><div class="num">${avg?avg.toFixed(1):'—'} ⭐</div><div class="lbl">AVERAGE RATING</div></div></div><div class="section-title" style="margin-top:22px">PLANNED COOKS</div>${plans.length?plans.map(planCard).join(''):'<div class="card empty muted">No planned cooks yet.</div>'}`}
function planCard(p){let d=new Date(p.dinner),s=new Date(p.start);return `<div class="plan-card"><div class="plan-date">${d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div><div class="plan-title">${p.protein}</div><div class="plan-meta"><b>Eat:</b> ${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}<br><b>Recommended start:</b> ${s.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} at ${s.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}<br><b>Protein needed:</b> ${lbOz(p.raw)}</div><div class="plan-actions"><button class="smallbtn" onclick="viewPlan('${p.id}')">View Plan</button><button class="smallbtn danger" onclick="deletePlan('${p.id}')">Delete</button></div></div>`}
function defaultCookHours(p){return {'Beef Tri-Tip':6.9,'Beef Brisket':10,'Beef Ribs':6,'Pork Shoulder / Pulled Pork':9,'Pork Ribs':5,'Turkey':5,'Chicken':2.5}[p]||6}function planCalc(recipeId){let p=document.getElementById('p').value,n=+document.getElementById('people').value||1,left=document.getElementById('left').value,cs=db.cooks.filter(c=>c.protein===p&&has(c.raw)&&has(c.cooked)&&has(c.people));let yieldPct=cs.length?cs.reduce((a,c)=>a+c.cooked/c.raw,0)/cs.length:.67,ozpp=cs.length?cs.reduce((a,c)=>a+Math.max(0,(c.cooked-(+c.leftover||0))*16/c.people),0)/cs.length:5,extra=left==='Lots'?1:left==='Some'?.5:0,raw=(n*ozpp/16+extra)/yieldPct,timed=cs.filter(c=>c.start&&c.pull),cookH=timed.length?timed.reduce((a,c)=>a+hours(c),0)/timed.length:defaultCookHours(p),recipe=recipeId?db.recipes.find(r=>r.id===recipeId):null,restM=recipe&&has(recipe.restMinutes)?+recipe.restMinutes:+db.settings.defaultRest||30;let d=document.getElementById('date').value,t=document.getElementById('time').value,dinner=d&&t?new Date(`${d}T${t}`):null,start=dinner?new Date(dinner.getTime()-(cookH*60+restM)*60000):null;document.getElementById('estimate').innerHTML=`<b>Recommended protein:</b> ${lbOz(raw)}<br><b>Recommended start:</b> ${start?start.toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Choose date/time'}<br><span class="muted">${cs.length?'Cook time uses your matching history.':'Cook time uses starter estimates until more matching data is recorded.'} Planned rest: ${restM} min${recipe&&has(recipe.restMinutes)?' from selected recipe':' from Settings' }.</span>`;return {raw,cookH,restM,dinner,start}}
function plan(recipeId){nav('Home');let today=new Date(),rr=recipeId?db.recipes.find(r=>r.id===recipeId):null;app.innerHTML=`<button class="back" onclick="home()">← Home</button><div class="card"><h2>📅 Plan a Cook</h2><label>Protein</label><select id="p">${P.map(x=>`<option ${rr&&rr.protein===x?'selected':''}>${x}</option>`).join('')}</select>${rr?`<p class="hint">Planning from recipe: <b>${esc(rr.name)}</b> · ${has(rr.restMinutes)?rr.restMinutes+' min planned rest':db.settings.defaultRest+' min default rest'}</p>`:''}<label>Number of people</label><input id="people" type="number" inputmode="numeric" value="5" min="1"><label>Leftovers</label><select id="left"><option>None</option><option selected>Some</option><option>Lots</option></select><label>Date</label><input id="date" type="date" value="${today.toISOString().slice(0,10)}"><label>Eat time</label><input id="time" type="time" value="18:00"><div id="estimate" class="estimate"></div></div><button class="big save" onclick="savePlan('${rr?rr.id:''}')">SAVE PLANNED COOK</button>`;['p','people','left','date','time'].forEach(id=>document.getElementById(id).addEventListener('input',()=>planCalc(rr?.id)));planCalc(rr?.id)}
function savePlan(recipeId){let x=planCalc(recipeId||null),p={id:'p'+Date.now(),protein:document.getElementById('p').value,people:+document.getElementById('people').value||1,leftovers:document.getElementById('left').value,raw:x.raw,dinner:x.dinner.toISOString(),start:x.start.toISOString(),cookHours:x.cookH,restMinutes:x.restM,createdAt:new Date().toISOString()};db.plans.push(p);save();home()}function viewPlan(id){let p=db.plans.find(x=>x.id===id);if(!p)return;let d=new Date(p.dinner),s=new Date(p.start);app.innerHTML=`<button class="back" onclick="home()">← Home</button><div class="card"><h2>🔥 Planned Cook</h2><div class="pill">${p.protein}</div><div class="detail"><div class="row"><span>Eat</span><b>${d.toLocaleString()}</b></div><div class="row"><span>Recommended start</span><b>${s.toLocaleString()}</b></div><div class="row"><span>Protein needed</span><b>${lbOz(p.raw)}</b></div><div class="row"><span>People</span><b>${p.people}</b></div><div class="row"><span>Leftovers</span><b>${p.leftovers}</b></div></div></div><button class="big" onclick="startPlannedCook('${p.id}')">🔥 START THIS COOK</button>`}function deletePlan(id){if(confirm('Delete this planned cook?')){db.plans=db.plans.filter(p=>p.id!==id);save();home()}}function nextNum(){return db.cooks.length?Math.max(...db.cooks.map(c=>+c.num||0))+1:1}function startPlannedCook(id){let p=db.plans.find(x=>x.id===id);if(!p)return;startCookForm(p)}
function startCookForm(planObj){let c=planObj?{num:nextNum(),protein:planObj.protein,people:planObj.people,raw:planObj.raw,planId:planObj.id,start:new Date().toISOString()}: {num:nextNum(),protein:P[0],people:'',raw:null,start:new Date().toISOString(),pellets:db.settings.defaultPellet};renderCookForm(c,false)}
function tempRows(changes=[]){return `<div id="tempChanges">${changes.map((x,i)=>tempRow(i,x)).join('')}</div><button class="smallbtn" style="width:100%;margin-top:10px" onclick="addTempChange()">＋ TEMP CHANGE</button>`}function tempRow(i,x={}){return `<div class="temp-change" data-temp-row><div class="two"><div><label>New cook temp (°F)</label><input data-t="temp" type="number" inputmode="numeric" value="${x.temp||''}"></div><div><label>Time changed</label><input data-t="time" type="datetime-local" value="${localInput(x.time)}"></div></div><button class="smallbtn danger" onclick="this.closest('[data-temp-row]').remove()">Remove</button></div>`}function addTempChange(){document.getElementById('tempChanges').insertAdjacentHTML('beforeend',tempRow(Date.now(),{time:new Date().toISOString()}));wireKeyboard()}
function rubChoices(selected){let vals=Array.isArray(selected)?selected:String(selected||'').split(/\s*\+\s*/).filter(Boolean);return `<label>Rubs / seasonings (select all that apply)</label><div class="card" style="padding:10px">${db.settings.rubs.map((r,i)=>`<label style="font-weight:500;margin:7px 0"><input type="checkbox" data-rub value="${esc(r)}" ${vals.includes(r)?'checked':''} style="width:auto;margin-right:8px">${esc(r)}</label>`).join('')||'<span class="muted">Add rubs in Settings.</span>'}</div>`}function renderCookForm(c,isEdit){let raw=weightFields('raw','Raw weight',c.raw),cook=weightFields('cooked','Final cooked weight',c.cooked),left=weightFields('leftover','Leftover weight',c.leftover);let pelletOpts=db.settings.pellets.map(x=>`<option ${x===(c.pellets||db.settings.defaultPellet)?'selected':''}>${esc(x)}</option>`).join('');app.innerHTML=`<button class="back" onclick="${isEdit?`openCook(${c.num})`:'home()'}">← ${isEdit?'Cook':'Home'}</button><div class="card"><h2>🔥 ${isEdit?'Edit':'Start'} Cook — #${c.num}</h2><label>Protein</label><select id="protein">${P.map(x=>`<option ${x===c.protein?'selected':''}>${esc(x)}</option>`).join('')}</select>${raw}<label>Starting cook temp (°F)</label><input id="startTemp" type="number" inputmode="numeric" value="${c.startTemp||''}" placeholder="e.g. 180"><label>Start time</label><input id="start" type="datetime-local" value="${localInput(c.start||new Date().toISOString())}"><label>Wrapped time (optional)</label><input id="wrapped" type="datetime-local" value="${localInput(c.wrapped)}">${tempRows(c.tempChanges||[])}<label>Pull time</label><input id="pull" type="datetime-local" value="${localInput(c.pull)}">${cook}<label>Served / eat time (optional)</label><input id="served" type="datetime-local" value="${localInput(c.served)}"><div id="restCalc" class="estimate">Rest / hold time will calculate from Pull → Served.</div><label>People fed</label><input id="fed" type="number" inputmode="numeric" value="${has(c.people)?c.people:''}" min="1">${left}</div><div class="card"><label>Rating</label><select id="rating">${[5,4,3,2,1].map(n=>`<option value="${n}" ${(+c.rating||5)===n?'selected':''}>${'⭐'.repeat(n)}</option>`).join('')}</select><label>Pellets</label><select id="pellets">${pelletOpts}</select>${rubChoices(c.rubs||c.rub)}<label>Notes</label><textarea id="notes">${esc(c.notes||'')}</textarea></div><button class="big save" onclick="collectCook(${isEdit?'true':'false'},${c.num})">${isEdit?'SAVE CHANGES':'SAVE COOK'}</button>`;['pull','served'].forEach(id=>document.getElementById(id).addEventListener('input',updateRest));updateRest();wireKeyboard()}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function updateRest(){let p=document.getElementById('pull')?.value,s=document.getElementById('served')?.value,h=p&&s?(new Date(s)-new Date(p))/36e5:0;document.getElementById('restCalc').innerHTML=`<b>Calculated rest / hold time:</b> ${h>0?fmtDur(h):'—'}`}function collectTemps(){return [...document.querySelectorAll('[data-temp-row]')].map(r=>({temp:+r.querySelector('[data-t=temp]').value||null,time:iso(r.querySelector('[data-t=time]').value)})).filter(x=>x.temp||x.time)}function collectCook(isEdit,num){let old=isEdit?db.cooks.find(x=>x.num===num):{},rubs=[...document.querySelectorAll('[data-rub]:checked')].map(x=>x.value),c={...old,num,protein:document.getElementById('protein').value,raw:fromLbOz(document.getElementById('rawLb').value,document.getElementById('rawOz').value),startTemp:+document.getElementById('startTemp').value||null,start:iso(document.getElementById('start').value),wrapped:iso(document.getElementById('wrapped').value),tempChanges:collectTemps(),pull:iso(document.getElementById('pull').value),cooked:fromLbOz(document.getElementById('cookedLb').value,document.getElementById('cookedOz').value),served:iso(document.getElementById('served').value),people:+document.getElementById('fed').value||null,leftover:fromLbOz(document.getElementById('leftoverLb').value,document.getElementById('leftoverOz').value),rating:+document.getElementById('rating').value,pellets:document.getElementById('pellets').value,rubs,rub:rubs.join(' + '),notes:document.getElementById('notes').value};if(!c.start){alert('Please enter a start time.');return}if(isEdit){db.cooks=db.cooks.map(x=>x.num===num?c:x)}else{db.cooks.push(c);if(c.planId)db.plans=db.plans.filter(p=>p.id!==c.planId)}save();cooks()}
let touchX={},swiped={},openSwipe=null;function closeSwipes(){document.querySelectorAll('.cook-row').forEach(r=>r.style.transform='translateX(0)');openSwipe=null}function ts(e,n){if(openSwipe&&openSwipe!==n)closeSwipes();touchX[n]=e.changedTouches[0].clientX;swiped[n]=false}function te(e,n){let dx=e.changedTouches[0].clientX-touchX[n],r=document.querySelector('#cw'+n+' .cook-row');if(dx<-60){swiped[n]=true;closeSwipes();r.style.transform='translateX(-85px)';openSwipe=n}else if(dx>40){closeSwipes()}}document.addEventListener('click',e=>{if(openSwipe&&!e.target.closest('#cw'+openSwipe))closeSwipes()});

function settings(){nav('Home');app.innerHTML=`<button class="back" onclick="home()">← Home</button><div class="card"><h2>⚙️ Settings</h2><label>Default planned rest time (minutes)</label><input id="setRest" type="number" inputmode="numeric" min="0" value="${db.settings.defaultRest}"><p class="hint">Used by Plan a Cook unless a matching recipe has its own planned rest time.</p></div><div class="card"><h3>Pellets</h3><label>Default pellets</label><select id="setDefaultPellet">${db.settings.pellets.map(x=>`<option ${x===db.settings.defaultPellet?'selected':''}>${esc(x)}</option>`).join('')}</select>${listEditor('pellets',db.settings.pellets)}</div><div class="card"><h3>Rubs / Seasonings</h3><p class="hint">These become multi-select choices on Start a Cook.</p>${listEditor('rubs',db.settings.rubs)}</div><div class="card"><h3>Proteins</h3><p class="hint">Customize the protein list used by Plan a Cook and Start a Cook.</p>${listEditor('proteins',db.settings.proteins)}</div><div class="card"><h3>Recipe Categories</h3><p class="hint">Categories used when adding and filtering recipes.</p>${listEditor('recipeCategories',db.settings.recipeCategories)}</div><button class="big" onclick="saveSettings()">SAVE SETTINGS</button><div class="card" style="margin-top:14px"><h3>Data Backup</h3><p class="muted">Export a backup before updates or anytime you want an extra copy.</p><div class="toolbar"><button class="smallbtn" onclick="exportBackup()">Export Backup</button><button class="smallbtn" onclick="document.getElementById('restoreFile').click()">Restore Backup</button></div><input id="restoreFile" type="file" accept="application/json" style="display:none" onchange="restoreBackup(event)"></div>`;wireKeyboard()}function listEditor(type,items){return `<div id="list-${type}">${items.map((x,i)=>`<div class="two" style="margin:7px 0"><input data-list="${type}" value="${esc(x)}"><button class="smallbtn danger" onclick="this.parentElement.remove()">Remove</button></div>`).join('')}</div><button class="smallbtn" style="width:100%;margin-top:8px" onclick="addListItem('${type}')">＋ Add</button>`}function addListItem(type){document.getElementById('list-'+type).insertAdjacentHTML('beforeend',`<div class="two" style="margin:7px 0"><input data-list="${type}" placeholder="New ${type.slice(0,-1)}"><button class="smallbtn danger" onclick="this.parentElement.remove()">Remove</button></div>`)}function saveSettings(){db.settings.defaultRest=Math.max(0,+document.getElementById('setRest').value||0);['pellets','rubs','proteins','recipeCategories'].forEach(type=>{db.settings[type]=[...document.querySelectorAll(`[data-list="${type}"]`)].map(x=>x.value.trim()).filter(Boolean)});let d=document.getElementById('setDefaultPellet').value;db.settings.defaultPellet=db.settings.pellets.includes(d)?d:(db.settings.pellets[0]||'');save();home()}
function exportBackup(){let blob=new Blob([JSON.stringify({version:'3.1',exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BBQ_Logbook_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!d.cooks||!Array.isArray(d.cooks))throw Error();if(confirm('Restore this backup? It will replace the logbook data currently on this device.')){db=d;db.plans=db.plans||[];db.recipes=db.recipes||[];db.settings=db.settings||{};db.settings.recipeCategories=db.settings.recipeCategories||['Main Dish','Appetizer','Side','Dessert','Sauce','Other'];save();home()}}catch(_){alert('That file is not a valid BBQ Logbook backup.')}};r.readAsText(f)}
function wireKeyboard(){document.querySelectorAll('input[type=number]').forEach(x=>{x.addEventListener('focus',()=>document.getElementById('donebar').style.display='block');x.addEventListener('blur',()=>setTimeout(()=>{if(!document.activeElement||document.activeElement.type!=='number')document.getElementById('donebar').style.display='none'},100))})}function dismissKeyboard(){document.activeElement?.blur();document.getElementById('donebar').style.display='none'}app.addEventListener('click',e=>{if(document.activeElement?.type==='number'&&!e.target.closest('input'))dismissKeyboard()});
home();
</script></body></html>
