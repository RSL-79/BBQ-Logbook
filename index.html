<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#222"><title>BBQ Logbook V2</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f4f4;color:#222}header{background:#222;color:#fff;padding:18px 18px 16px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:24px}header div{margin-top:3px;color:#ccc;font-size:13px}main{max-width:680px;margin:auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom))}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px #0001}.big{width:100%;background:#333;color:#fff;font-weight:750;font-size:18px;padding:18px;border:0;border-radius:13px}.section-title{margin:6px 2px 10px;font-size:17px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border-radius:14px;padding:15px;text-align:center;box-shadow:0 1px 4px #0001}.stat .num{font-size:25px;font-weight:800}.stat .lbl{font-size:12px;color:#666;margin-top:3px}.muted{color:#666;font-size:14px}label{display:block;font-weight:700;font-size:13px;color:#555;margin:13px 0 6px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;background:#fff}textarea{min-height:100px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.duration{font-weight:750}.estimate{background:#f7f7f7;border-radius:12px;padding:12px;margin-top:14px}.save{margin-top:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;background:#fff;border:0;padding:10px 4px 9px;font-size:12px;color:#333}.nav .active{font-weight:800}.empty{padding:20px;text-align:center}.cook-wrap{position:relative;overflow:hidden;border-radius:15px;margin-bottom:10px}.cook-row{background:#fff;padding:15px;position:relative;z-index:2;transition:transform .2s ease;touch-action:pan-y}.delete-bg{position:absolute;inset:0;background:#d33;display:flex;align-items:center;padding-left:18px;color:#fff;font-weight:800}.delete-btn{position:absolute;right:0;top:0;height:100%;width:85px;background:#d33;color:#fff;border:0;font-weight:800}.detail{margin-top:8px}.pill{display:inline-block;background:#eee;border-radius:20px;padding:4px 8px;font-size:12px;margin:2px}.smallbtn{padding:9px 12px;border-radius:10px;background:#eee;border:0}.danger{background:#d33;color:#fff}.stars{letter-spacing:1px}.back{background:none;border:0;padding:0 0 10px;font-weight:700}.hint{font-size:12px;color:#777;margin-top:6px}
</style></head><body>
<header><h1>🔥 BBQ Logbook</h1><div id="sub">Your personal BBQ history</div></header><main id="app"></main>
<nav class="nav"><button id="nHome" onclick="home()">🏠<br>Home</button><button id="nCooks" onclick="cooks()">📋<br>Cooks</button><button id="nRecipes" onclick="recipes()">📖<br>Recipes</button></nav>
<script>
const P=['Beef Tri-Tip','Beef Brisket','Beef Ribs','Pork Shoulder / Pulled Pork','Pork Ribs','Turkey','Chicken','Other'];
const seedCooks=[
 {num:1,protein:'Pork Shoulder / Pulled Pork',people:null,raw:9.6,cooked:null,leftover:null,start:null,pull:null,rest:'30 min',rating:4,pellets:'Recteq Ultimate Blend',rub:'',notes:'Turned out good, not great; bark could have been better.'},
 {num:2,protein:'Beef Tri-Tip',people:null,raw:2.8,cooked:null,leftover:null,start:'2026-08-16T10:08',pull:'2026-08-16T17:01',rest:'1 hr',rating:5,pellets:'Recteq Ultimate Blend',rub:'Four Letter Rub + Ben’s Heffer Dust',notes:'Cooked like brisket. Turned out great.'},
 {num:3,protein:'Beef Tri-Tip',people:null,raw:2.8,cooked:null,leftover:null,start:'2026-08-21T10:08',pull:'2026-08-21T17:01',rest:'1 hr',rating:5,pellets:'Recteq Ultimate Blend',rub:'Four Letter Rub + Ben’s Heffer Dust',notes:'Cooked like brisket. Turned out great.'}
];
let db=JSON.parse(localStorage.getItem('bbqLogbookV2')||'null');
if(!db){db={cooks:seedCooks,recipes:[],active:null};localStorage.setItem('bbqLogbookV2',JSON.stringify(db));}
// V2.2 migration: correct the original placeholder values for historical cooks.
// These three historical records never had verified cooked/leftover weights entered.
const hist=db.cooks||[];
[1,2,3].forEach(n=>{const c=hist.find(x=>x.num===n); if(c && (c._historicalSeed===true || (c._historicalSeed===undefined && !bbqHasNumber(c.cooked) && !bbqHasNumber(c.leftover)))){c.cooked=null;c.leftover=null;c.people=null; c._historicalSeed=true;}});
saveV22=()=>localStorage.setItem('bbqLogbookV2',JSON.stringify(db));
saveV22();
function bbqHasNumber(v){return v!==undefined&&v!==null&&v!==''&&Number.isFinite(Number(v))} function bbqValueOrNA(v){return bbqHasNumber(v)?v:'Not recorded'}
const app=document.getElementById('app'); const save=()=>localStorage.setItem('bbqLogbookV2',JSON.stringify(db));
function nav(a){['Home','Cooks','Recipes'].forEach(x=>document.getElementById('n'+x).classList.toggle('active',x===a));}
function hours(c){if(!c.start||!c.pull)return 0;let a=new Date(c.start),b=new Date(c.pull),h=(b-a)/36e5;return h>0?h:0}
function fmtDur(h){if(!h)return '—';let m=Math.round(h*60);return Math.floor(m/60)+' hr '+(m%60)+' min'}
function stars(n){return '⭐'.repeat(n||0)}
function home(){nav('Home');let totalHours=db.cooks.reduce((a,c)=>a+hours(c),0),lbs=db.cooks.filter(c=>bbqHasNumber(c.cooked)).reduce((a,c)=>a+Number(c.cooked),0),rated=db.cooks.filter(c=>bbqHasNumber(c.rating)),avg=rated.length?rated.reduce((a,c)=>a+Number(c.rating),0)/rated.length:0;let counts={};db.cooks.forEach(c=>counts[c.protein]=(counts[c.protein]||0)+1);let top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];app.innerHTML=`<div class="card"><button class="big" onclick="plan()">🔥 PLAN A COOK</button></div><div class="section-title">YOUR BBQ</div><div class="stats"><div class="stat"><div class="num">${db.cooks.length}</div><div class="lbl">TOTAL COOKS</div></div><div class="stat"><div class="num">${fmtDur(totalHours)}</div><div class="lbl">TOTAL COOK TIME</div></div><div class="stat"><div class="num">${top?top[1]+'×':'—'}</div><div class="lbl">MOST COOKED PROTEIN</div><div class="muted">${top?top[0]:'—'}</div></div><div class="stat"><div class="num">${avg?avg.toFixed(1):'—'} ⭐</div><div class="lbl">AVERAGE RATING</div></div><div class="stat"><div class="num">${lbs?lbs.toFixed(1)+' lb':'—'}</div><div class="lbl">TOTAL COOKED</div></div><div class="stat"><div class="num">${db.recipes.length}</div><div class="lbl">RECIPES</div></div></div>`}
function plan(){nav('Home');app.innerHTML=`<button class="back" onclick="home()">← Home</button><div class="card"><h2>🔥 Plan a Cook</h2><label>Protein</label><select id="p">${P.map(x=>`<option>${x}</option>`).join('')}</select><label>How many people?</label><input id="people" type="number" value="5" min="1"><label>Leftovers</label><select id="left"><option>None</option><option selected>Some</option><option>Lots</option></select><label>When are you eating?</label><input id="date" type="date"><label>Dinner time</label><input id="time" type="time" value="18:00"><label>Planned raw weight (optional)</label><input id="raw" type="number" step=".1" placeholder="e.g. 3.0"><div id="estimate" class="estimate">Planning estimate will appear here.</div></div><button class="big" onclick="startCook()">🔥 START THIS COOK</button>`;document.getElementById('date').value=new Date().toISOString().slice(0,10);['p','people','left','raw'].forEach(id=>document.getElementById(id).addEventListener('input',estimate));estimate()}
function estimate(){let p=document.getElementById('p').value,n=+document.getElementById('people').value||1,cs=db.cooks.filter(c=>c.protein===p&&c.raw&&c.cooked&&c.people),yp=cs.length?cs.reduce((a,c)=>a+c.cooked/c.raw,0)/cs.length:.67,oz=cs.length?cs.reduce((a,c)=>a+((c.cooked-c.leftover)*16/c.people),0)/cs.length:5,extra=document.getElementById('left').value==='Lots'?1:document.getElementById('left').value==='Some'?.5:0,cooked=n*oz/16+extra,raw=cooked/yp,rawInput=+document.getElementById('raw').value||0;document.getElementById('estimate').innerHTML=`<b>Planning estimate</b><br>Recommended raw amount: <strong>${(rawInput||raw).toFixed(1)} lb</strong><br>Expected cooked amount: <strong>${(rawInput?rawInput*yp:cooked).toFixed(1)} lb</strong><br><span class="muted">${cs.length?'Based on your '+cs.length+' matching cook'+(cs.length==1?'':'s')+'.':'Starting assumption until you have matching cooks.'}</span>`}
function startCook(){let d=document.getElementById('date').value,t=document.getElementById('time').value;db.active={num:(db.cooks.length?Math.max(...db.cooks.map(c=>c.num)):0)+1,protein:document.getElementById('p').value,people:+document.getElementById('people').value||1,raw:+document.getElementById('raw').value||0,plannedDate:d,plannedDinner:t,start:new Date().toISOString()};save();finish()}
function finish(){let c=db.active;app.innerHTML=`<button class="back" onclick="cooks()">← Cooks</button><div class="card"><h2>🔥 Finish Cook — #${c.num}</h2><label>Start time</label><input id="start" type="datetime-local" value="${localInput(c.start)}"><div class="hint">Recorded automatically when you tapped START THIS COOK. Edit if needed.</div><label>Pull time</label><input id="pull" type="datetime-local" value="${localInput(new Date().toISOString())}"><label>Final cooked weight (lb)</label><input id="cooked" type="number" step=".1" placeholder="e.g. 2.0"><label>Rest time</label><input id="rest" placeholder="e.g. 45 min"><label>People fed</label><input id="fed" type="number" value="${c.people}" min="1"><label>Leftover weight (lb)</label><input id="leftover" type="number" step=".1" placeholder="e.g. 0.5"><div id="result" class="estimate">Enter cooked weight and leftovers for results.</div></div><div class="card"><label>Rating</label><select id="rating"><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option></select><label>Pellets</label><input id="pellets" value="Recteq Ultimate Blend"><label>Rub / seasoning</label><input id="rub"><label>Notes</label><textarea id="notes"></textarea></div><button class="big save" onclick="saveCook()">SAVE COOK</button>`;['start','pull','cooked','leftover','fed'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc()}
function localInput(iso){let d=new Date(iso);let p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function calc(){let c=db.active||{},s=document.getElementById('start')?.value,p=document.getElementById('pull')?.value,cooked=+document.getElementById('cooked')?.value||0,l=+document.getElementById('leftover')?.value||0,f=+document.getElementById('fed')?.value||0;let h=s&&p?(new Date(p)-new Date(s))/36e5:0;let e=Math.max(0,cooked-l),y=c.raw?cooked/c.raw*100:0;document.getElementById('result').innerHTML=`<b>Cook results</b><br>Cook duration: <strong>${fmtDur(h)}</strong><br>Cooked yield: <strong>${c.raw?y.toFixed(0)+'%':'—'}</strong><br>Amount eaten: <strong>${e.toFixed(2)} lb</strong><br>Average consumed: <strong>${f?((e*16)/f).toFixed(1):'—'} oz/person</strong>`}
function saveCook(){let c=db.active;c.start=new Date(document.getElementById('start').value).toISOString();c.pull=new Date(document.getElementById('pull').value).toISOString();c.cooked=+document.getElementById('cooked').value||0;c.rest=document.getElementById('rest').value;c.people=+document.getElementById('fed').value||c.people;c.leftover=+document.getElementById('leftover').value||0;c.rating=+document.getElementById('rating').value;c.pellets=document.getElementById('pellets').value;c.rub=document.getElementById('rub').value;c.notes=document.getElementById('notes').value;db.cooks.push(c);db.active=null;save();cooks()}
function cookCard(c){return `<div class="cook-wrap" id="cw${c.num}"><div class="delete-bg">DELETE</div><button class="delete-btn" onclick="delCook(${c.num})">Delete</button><div class="cook-row" ontouchstart="ts(event,${c.num})" ontouchend="te(event,${c.num})" onclick="openCook(${c.num})"><b>#${c.num} — ${c.protein}</b><div class="muted">${bbqHasNumber(c.raw)?c.raw+' lb raw':'Not recorded'} → ${bbqHasNumber(c.cooked)?c.cooked+' lb cooked':'Not recorded'} · ${bbqHasNumber(c.people)?c.people+' people':'People not recorded'}</div><div><span class="duration">${fmtDur(hours(c))}</span> · ${stars(c.rating)}</div></div></div>`}
let touchX={};function ts(e,n){touchX[n]=e.changedTouches[0].clientX}function te(e,n){let dx=e.changedTouches[0].clientX-touchX[n];if(dx>60){document.querySelector('#cw'+n+' .cook-row').style.transform='translateX(85px)'}}
function delCook(n){if(!confirm('Delete Cook #'+n+'? This cannot be undone.'))return;db.cooks=db.cooks.filter(c=>c.num!==n);save();cooks()}
function cooks(){nav('Cooks');app.innerHTML=`<h2>📋 Cook History</h2><div class="hint">Swipe a cook to the right to reveal Delete.</div>${db.cooks.slice().sort((a,b)=>b.num-a.num).map(cookCard).join('')||'<div class="card empty muted">No cooks recorded yet.</div>'}`}
function openCook(n){let c=db.cooks.find(x=>x.num===n);if(!c)return;app.innerHTML=`<button class="back" onclick="cooks()">← Cook History</button><div class="card"><h2>Cook #${c.num}</h2><div class="pill">${c.protein}</div><div class="detail"><div class="row"><span>Start</span><b>${new Date(c.start).toLocaleString()}</b></div><div class="row"><span>Pull</span><b>${new Date(c.pull).toLocaleString()}</b></div><div class="row"><span>Cook time</span><b>${fmtDur(hours(c))}</b></div><div class="row"><span>Raw weight</span><b>${c.raw||'—'} lb</b></div><div class="row"><span>Cooked weight</span><b>${bbqHasNumber(c.cooked)?c.cooked+' lb':'Not recorded'}</b></div><div class="row"><span>Leftovers</span><b>${bbqHasNumber(c.leftover)?c.leftover+' lb':'Not recorded'}</b></div><div class="row"><span>People fed</span><b>${bbqHasNumber(c.people)?c.people:'Not recorded'}</b></div><div class="row"><span>Rating</span><b>${stars(c.rating)}</b></div></div></div><div class="card"><b>Pellets</b><p>${c.pellets||'—'}</p><b>Rub / seasoning</b><p>${c.rub||'—'}</p><b>Notes</b><p>${c.notes||'—'}</p></div><button class="big danger" onclick="delCook(${c.num})">DELETE THIS COOK</button>`}
function recipes(){nav('Recipes');app.innerHTML=`<div class="card"><h2>📖 My Recipes</h2><p class="muted">${db.recipes.length} saved recipe${db.recipes.length==1?'':'s'}.</p><button class="big" onclick="addRecipe()">＋ ADD RECIPE</button></div>${db.recipes.map((r,i)=>`<div class="card"><b>${r.name}</b><p class="muted">${r.method||''}</p><button class="smallbtn danger" onclick="delRecipe(${i})">Delete</button></div>`).join('')||'<div class="card empty muted">No recipes saved yet.</div>'}`}
function addRecipe(){let n=prompt('Recipe name:');if(!n)return;let m=prompt('Recipe instructions:')||'';db.recipes.push({name:n,method:m});save();recipes()}
function delRecipe(i){if(!confirm('Delete this recipe? This cannot be undone.'))return;db.recipes.splice(i,1);save();recipes()}
home();
</script>


</body></html>
